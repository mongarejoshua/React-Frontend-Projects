
name: Build and Deploy All React Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build All React Projects
        run: |
          set -e

          mkdir -p site

          build_project() {
            PROJECT="$1"
            SLUG="$2"

            echo "===================================="
            echo "Building: $PROJECT"
            echo "===================================="

            if [ ! -d "$PROJECT" ]; then
              echo "ERROR: Project folder not found: $PROJECT"
              exit 1
            fi

            if [ ! -f "$PROJECT/package.json" ]; then
              echo "ERROR: package.json not found in $PROJECT"
              exit 1
            fi

            if [ ! -f "$PROJECT/package-lock.json" ]; then
              echo "ERROR: package-lock.json not found in $PROJECT"
              exit 1
            fi

            npm ci --prefix "$PROJECT"

            npm run build --prefix "$PROJECT" -- --base="/$SLUG/"

            if [ ! -d "$PROJECT/dist" ]; then
              echo "ERROR: Build output folder not found: $PROJECT/dist"
              exit 1
            fi

            mkdir -p "site/$SLUG"

            cp -r "$PROJECT/dist/." "site/$SLUG/"

            echo "Successfully built: $PROJECT"
          }

          build_project "cat photo app" "cat-photo-app"
          build_project "cafe menu app" "cafe-menu-app"
          build_project "color palette library" "color-palette-library"
          build_project "rothko painting" "rothko-painting"
          build_project "photo library" "photo-library"
          build_project "nutrition label" "nutrition-label"
          build_project "quiz app" "quiz-app"
          build_project "tribute page" "tribute-page"
          build_project "balance sheet app" "balance-sheet-app"
          build_project "cat painting app" "cat-painting-app"
          build_project "piano app" "piano-app"
          build_project "technical documentation page" "technical-documentation-page"
          build_project "city skyline" "city-skyline"
          build_project "magazine app" "magazine-app"
          build_project "product landing page" "product-landing-page"
          build_project "ferris wheel app" "ferris-wheel-app"
          build_project "penguin app" "penguin-app"
          build_project "personal portfolio app" "personal-portfolio-app"

          echo "===================================="
          echo "All projects built successfully!"
          echo "===================================="

          if [ -f "index.html" ]; then
            cp index.html site/index.html
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
