
name: Deploy React Projects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Cat Photo App
        run: |
          npm ci --prefix "cat photo app"
          npm run build --prefix "cat photo app"
          mkdir -p site/cat-photo-app
          cp -R "cat photo app/dist/." site/cat-photo-app/

      - name: Build Cafe Menu App
        run: |
          npm ci --prefix "cafe menu app"
          npm run build --prefix "cafe menu app"
          mkdir -p site/cafe-menu-app
          cp -R "cafe menu app/dist/." site/cafe-menu-app/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
